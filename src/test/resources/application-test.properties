# The test schema. Activated by @ActiveProfiles("test") on every context test, so these values are
# layered on top of src/main/resources/application.properties rather than replacing it - a file
# called application.properties in src/test/resources would shadow the main one entirely and take
# every other setting with it.
#
# Why this exists: the context tests ran against the same database as the application. They executed
# every startup migration there, let ddl-auto=update work on it, and took their fixtures from
# whatever rows happened to be present. No run was reproducible and none was safe.
spring.datasource.url=jdbc:mariadb://h3:3306/scm_test?serverVersion=11.8.6-MariaDB&charset=utf8mb4&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=spring
spring.datasource.password=boot

# The schema is built from the entities on first run. Deliberately the same MariaDB version as in
# production: half the migration logic in config/ exists because of this server's behaviour - inline
# column CHECK constraints that DROP CONSTRAINT cannot reach, a MODIFY COLUMN that refuses to cast
# uuid to bigint, innodb_snapshot_isolation. An in-memory H2 would pass tests the real database fails.
spring.jpa.hibernate.ddl-auto=update

# The startup migrations in config/ run here too (ApplicationReadyEvent fires in @SpringBootTest),
# which is the point: StatusCheckConstraintTest and the migration tests are what holds them.
logging.level.com.supplychainmanagement.config=INFO
