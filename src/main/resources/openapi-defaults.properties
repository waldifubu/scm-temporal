# Defaults for the OpenAPI description, loaded by OpenApiConfig through @PropertySource.
#
# A @PropertySource ranks BELOW application.properties, so anything set there (or in a profile file, or
# in the environment) wins - these only apply where nothing says otherwise. That is the point: springdoc
# is on by default, and an application whose properties file never mentions it would publish the whole
# description of its API, roles included, to anybody. Off unless somebody turned it on.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
